# Default cargo-deny policy for UniverLab crates (used by scripts/rust-quality.sh
# when a crate ships no deny.toml of its own). A crate that needs an exception
# copies this file to its root and edits it there — the exception then lives
# next to the code that needs it, reviewed in that repo's PRs.

[graph]
all-features = true

[advisories]
# Vulnerabilities fail. Unmaintained/unsound notices fail too, for crates
# anywhere in the tree: a dead dependency is a decision to take, not to ignore.
version = 2
yanked = "deny"
unmaintained = "all"
# One documented ignore, added by the strict-gate work: fontdue 0.9.4 (the
# latest release) still pulls ttf-parser, so the advisory cannot be resolved
# by upgrading.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via fontdue, no maintained release; revisit when fontdue moves off it" },
]

[licenses]
version = 2
# Permissive licenses compatible with shipping MIT/Apache binaries.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The allow-list is lab-wide; a crate that uses only some of it is fine.
unused-allowed-license = "allow"

# Crate-scoped exceptions. Two only; any other GPL/odd license is a failure.

# auto_generate_cdp is build-time only: a code generator run by the
# headless_chrome build script, never linked into the shipped binary
# (verified with `cargo tree -i auto_generate_cdp -e all`).
[[licenses.exceptions]]
crate = "auto_generate_cdp"
allow = ["GPL-3.0-or-later"]

# libbz2-rs-sys ships the permissive bzip2-1.0.6 license text, pulled in via
# zip -> headless_chrome.
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[bans]
# Duplicate versions are reported, not failed: most come from upstream and a
# gate a crate cannot fix on its own teaches people to ignore gates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
